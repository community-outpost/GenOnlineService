name: Release artifact

on:
  push:
    branches: [ "main" ]
    tags: [ "v[0-9]+.[0-9]+.[0-9]+" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    name: Publish linux-x64 artifact
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false # no later step uses git credentials
        fetch-depth: 0 # the version is derived from the latest vX.Y.Z tag

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Publish
      run: dotnet publish GenOnlineService/GenOnlineService.csproj -c Release -r linux-x64 --self-contained false -o out

    - name: Check the version
      run: .github/check-version.sh "$(tr -d '\r\n' < out/version.txt)"

    - name: Package
      id: pack
      run: |
        # out/version.txt is written by the build (X.Y.Z+[<distance>.]<commit>): tags are named by X.Y.Z, other builds by the commit.
        version="$(tr -d '\r\n' < out/version.txt)"
        if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then label="${version%%+*}"; else label="${version##*[+.]}"; fi
        name="genonlineservice-${label}-linux-x64.tar.gz"
        tar -czf "${name}" -C out .
        sha256sum "${name}" > "${name}.sha256"
        echo "name=${name}" >> "$GITHUB_OUTPUT"

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ steps.pack.outputs.name }}
        path: |
          ${{ steps.pack.outputs.name }}
          ${{ steps.pack.outputs.name }}.sha256

    - name: Attach to GitHub Release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        # 0.x is alpha: those releases are marked as pre-releases.
        prerelease: ${{ startsWith(github.ref_name, 'v0.') }}
        files: |
          ${{ steps.pack.outputs.name }}
          ${{ steps.pack.outputs.name }}.sha256
